{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<main class="homepage">
  <section class="launch-card">
      <img
        src="{{ url_for('static', filename='images/branding/logo-icon.png') }}"
        alt="iPRAY 4U"
        class="launch-logo"
      >
    <div class="launch-copy">
      <h1>iPRAY 4U</h1>

      <p class="launch-tagline">
        Prayer requests, organized.
      </p>

      <p class="launch-description">
        Keep every request for the people you care about<br>
        in one place.
      </p>
    </div>

    <div class="launch-actions">
      <button class="btn add-prayer-button add-prayer-button-js">
        Add Prayer Request
      </button>

      <a class="btn btn-outline" href="{{ url_for('pages.prayer_requests_page') }}">
        View Prayer Requests
      </a>
    </div>
  </section>
</main>

<dialog class="modal modal-js add-prayer-request-modal-js"></dialog>
{% endblock %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}

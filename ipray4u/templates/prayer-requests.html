{% extends "base.html" %}

{% block title %}Prayer Requests{% endblock %}

{% block head %}
  <script src="https://kit.fontawesome.com/2917e784fa.js" crossorigin="anonymous"></script>
{% endblock %}

{% block content %}
<div class="prayer-requests-page">
  <nav class="nav-bar" aria-label="Main navigation">
    <a class="nav-logo" href="{{ url_for('pages.homepage') }}">
      <img 
        src="{{ url_for('static', filename='images/branding/logo-horizontal.png') }}"
        alt="iPRAY 4U"
        class="nav-logo-img"
      >
    </a>

    <ul class="nav-links">
      <li class="current-date current-date-js"></li>

      <li class="logout">
        <form action="{{ url_for('auth.logout_user') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="btn logout-button">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            Log out
          </button>
        </form>
      </li>
    </ul>
  </nav>

  <main>
    <section class="prayer-requests-panel">
      <div class="prayer-requests-banner">
        <div class="prayer-requests-title">
          <h1>Prayer Requests</h1>
          <p class="page-subtitle">Keep track of who you're praying for </p>
        </div>
      </div>
      
      <div class="prayer-requests-controls">
        <button type="button" class="btn add-prayer-button add-prayer-button-js">Add New Prayer Request</button>
        <div class="relationship-buttons-row relationship-buttons-row-js"></div>
      </div>

      <div class="person-cards person-cards-js"></div>
    </section>
  </main>

  <dialog class="modal modal-js add-prayer-request-modal-js"></dialog>
  <dialog class="modal modal-js delete-item-modal-js">
    <button type="button" class="close-button close-modal-js" aria-label="Close">&times;</button>
    <h2 class="form-title delete-title-js"></h2>
    <div>Are you sure you want to delete this <span class="item-to-delete-type"></span>?</div>
    <div class="item-to-delete"></div>
    <div>
      <button type="button" class="btn confirm-delete-button confirm-delete-button-js">Delete</button>
      <button type="button" class="btn close-modal-js deny-delete-button deny-delete-button-js">Cancel</button>
    </div>
  </dialog>
  <dialog class="modal modal-js edit-prayer-modal edit-prayer-modal-js">
    <button type="button" class="close-button close-modal-js" aria-label="Close">&times;</button>
    <form class="edit-prayer-form modal-form-js edit-prayer-form-js" method="POST">
      <h2 class="form-title">Edit Prayer</h2>
      <div class="form-data">
        <label for="prayer">Prayer Request</label>
        <textarea id="prayer" name="prayer" placeholder="Enter prayer here" rows="5" cols="20" required></textarea>

        <div class="checkbox-row">
          <input id="has-prayed" name="has-prayed" type="checkbox" value="Prayed" />
          <label for="has-prayed">Prayed</label>
        </div>
      </div>
      <button type="submit" name="submit" class="btn save-button save-button-js">Save</button>
    </form>
  </dialog>
  <dialog class="modal modal-js edit-person-modal edit-person-modal-js">
    <button type="button" class="close-button close-modal-js" aria-label="Close">&times;</button>
    <form class="edit-person-form modal-form-js edit-person-form-js" method="POST">
      <h2 class="form-title">Edit Person</h2>
      <div class="form-data">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Name" required/>
      </div>
      <div class="form-data">
        <label for="relationship">Relationship</label> 
        <select id="relationship" name="relationship" class="relationship-dropdown-js" required>
        </select>
      </div>
      <button type="submit" name="submit" class="btn save-button save-button-js">Save</button>
    </form>
  </dialog>
</div>
{% endblock %}

{% block scripts %}
  <script type="module" src="{{ url_for('static', filename='js/prayer-requests.js') }}"></script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Requests</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  </head>

  <body>
    <div class="prayer-requests-page">
      <nav class="nav-bar">
        <a href="{{ url_for('homepage') }}">
          <div class="nav-logo">
              <img src="{{ url_for('static', filename='images/phone-with-heart-texts.jpg') }}">
              <h3>iPray 4U</h3>
          </div>
        </a>
    
        <div class="nav-search">
          <input type="text" placeholder="Search Prayer Requests"/>
          <button><i class="fa fa-search"></i></button>
        </div>
    
        <ul class="nav-links">
          <li class="current-date-js"></li>
        </ul>
      </nav>

      <div class="prayer-requests-panel">
        <div class="prayer-requests-banner">
          <div class="prayer-requests-title">
            <h1>Prayer Requests</h1>
          </div>
        </div>
        
        <div class="relationships-row relationships-row-js"></div>

        <div class="person-cards"></div>
        <dialog class="modal add-prayer-request-modal-js"></dialog>
        <dialog class="modal delete-item-modal-js">
          <button class="close-button close-delete-item-modal-js" aria-label="Close">&times;</button>
          <h2 class="form-title">Delete</h2>
          <h2 class="item-to-delete"></h2>
          <div>
            <button class="btn confirm-delete-button confirm-delete-button-js">Yes</button>
            <button class="btn deny-delete-button deny-delete-button-js">No</button>
          </div>
        </dialog>
        <dialog class="modal edit-prayer-modal edit-prayer-modal-js"></dialog>
      </div>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/prayer-requests.js') }}"></script>
  </body>
</html>

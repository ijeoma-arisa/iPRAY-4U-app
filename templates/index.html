<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPray 4U | Home</title>
  

  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
  <div class="homepage">
    <div class="homepage-banner">
      <div class="homepage-title-banner">
        <h1>iPray 4U</h1>
        <h3>A simple way of organizing prayer requests</h3>
      </div>
      
      <div class="homepage-image-banner">
        <div class="homepage-image">
          <img src="{{ url_for('static', filename='images/phone-with-heart-texts.jpg') }}" class="homepage-image">
        </div>
        <div class="homepage-image-caption">
          <a href="http://www.freepik.com">Designed by studiogstock / Freepik</a>
        </div>
      </div>
  
      <div class="homepage-buttons-banner">
        <button class="btn add-prayer-button add-prayer-button-js">Add New Prayer Request</button>
        <a class="btn view-button" href="{{ url_for('prayer_requests_page') }}">View Prayer Requests</a>
        
        <dialog class="modal modal-js add-prayer-request-modal-js"></dialog>
        
      </div>
    </div>
  </div>
  <script type="module" src="{{ url_for('static', filename='js/index.js') }}"></script>

</html>
